name: Build Python APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java and Dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-17-jdk git zip unzip wget
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
    
    - name: Setup Python and Buildozer
      run: |
        pip install --upgrade pip
        pip install cython==0.29.33
        pip install buildozer
    
    - name: Create fresh buildozer.spec
      run: |
        # حذف الملف القديم وإنشاء ملف جديد كامل
        rm -f buildozer.spec
        buildozer init
        
        # تعديل الإعدادات بشكل صحيح
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,plyer/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/# android.ndk = 23b/android.ndk = 25b/' buildozer.spec
        sed -i 's/# android.api = 30/android.api = 31/' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 21/' buildozer.spec
        sed -i 's/# android.target = 30/android.target = 31/' buildozer.spec
        sed -i 's/source.include_exts = py/source.include_exts = py,png,jpg,kv,atlas,txt/' buildozer.spec
    
    - name: Show buildozer.spec content (debug)
      run: |
        echo "=== buildozer.spec ==="
        cat buildozer.spec | head -60
    
    - name: Build APK
      run: buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Code-Corrector
        path: bin/*.apk
